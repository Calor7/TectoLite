directories:
  output: release
  buildResources: assets
appId: com.tectolite.app
productName: TectoLite
win:
  icon: assets/icon.png
  target:
    - portable
mac:
  icon: assets/icon.png
  target:
    - dmg
linux:
  icon: assets/icon.png
  target:
    - AppImage
portable:
  artifactName: ${productName}-${version}.exe
files:
  - filter:
      - electron-main.cjs
      - preload.cjs
      - dist/**/*
      - package.json
      - LICENSE
      - NOTICE.txt
      - node_modules/**/*
electronVersion: 40.10.6
